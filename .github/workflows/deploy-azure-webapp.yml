name: Deploy FitForge Gateway & BFF

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'GRUPO.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: maven

      - name: Build + testes (Maven)
        run: mvn -B clean package

      - name: Guardar o JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: target/app.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Baixar o JAR
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Deploy no Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_GATEWAY }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: '*.jar'
